<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">YEOMAH — Accounting and Finance Management</title>
  <desc id="desc">Transparent vector logo with navy and gold monogram, upward growth arrow, bar chart and calculator.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123F78"/><stop offset="1" stop-color="#061A3C"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD45A"/><stop offset="1" stop-color="#E88A08"/></linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F69B5"/><stop offset="1" stop-color="#0A2D60"/></linearGradient>
  </defs>
  <!-- Monogram: bold geometric Y -->
  <g transform="translate(0,4)">
    <path d="M300 120 H405 L545 265 L685 120 H800 L590 345 L590 505 H475 L475 345 Z" fill="url(#navy)"/>
    <path d="M405 120 L545 265 L590 310 L590 345 L475 345 L475 326 L300 120 Z" fill="#0A2B5A"/>
    <path d="M405 120 L545 265 L590 310 L555 350 L415 205 Z" fill="url(#gold)"/>
    <!-- rising financial bars -->
    <path d="M635 400 V330 Q635 320 645 316 L700 295 V400 Z" fill="url(#blueBar)"/>
    <path d="M720 400 V275 Q720 265 730 261 L785 240 V400 Z" fill="url(#blueBar)"/>
    <path d="M805 400 V220 Q805 210 815 206 L870 185 V400 Z" fill="url(#blueBar)"/>
    <!-- upward arrow swoosh -->
    <path d="M315 430 C420 505 585 490 740 405 C825 358 875 292 915 205 L865 222 L892 140 L975 174 L934 188 C900 300 830 390 750 445 C590 555 405 550 315 430 Z" fill="url(#gold)"/>
    <path d="M360 440 C490 490 630 455 752 380 C810 345 855 295 883 246" fill="none" stroke="#FFF1C5" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <!-- calculator -->
    <g transform="translate(715 355) rotate(12)">
      <rect x="0" y="0" width="155" height="178" rx="22" fill="url(#navy)" stroke="#234B7C" stroke-width="7"/>
      <rect x="22" y="20" width="111" height="28" rx="7" fill="#D9E6F5"/>
      <g fill="#52739C">
        <rect x="24" y="64" width="25" height="20" rx="5"/><rect x="64" y="64" width="25" height="20" rx="5"/><rect x="104" y="64" width="25" height="20" rx="5"/>
        <rect x="24" y="96" width="25" height="20" rx="5"/><rect x="64" y="96" width="25" height="20" rx="5"/><rect x="104" y="96" width="25" height="20" rx="5"/>
        <rect x="24" y="128" width="25" height="20" rx="5"/><rect x="64" y="128" width="25" height="20" rx="5"/><rect x="104" y="128" width="25" height="20" rx="5"/>
      </g>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="600" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="900" letter-spacing="2" fill="url(#navy)">YEOMAH</text>
  <path d="M195 745 H340 M860 745 H1005" stroke="url(#gold)" stroke-width="9" stroke-linecap="square"/>
  <text x="600" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="1.2" fill="#0A2D60">Accounting and Finance Management</text>
</svg>
